name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          timeout: 60s
          script: |
            # Navigate to project directory (make sure this path is correct on your server)
            mkdir -p ~/news-app
            cd ~/news-app
            
            # If the repo isn't cloned yet, clone it. Otherwise, pull latest.
            if [ ! -d ".git" ]; then
              git clone https://github.com/Rohitiwari297/NEW_APP_BACKEND.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            
            # Start the application
            docker-compose up -d --build
